<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetch</title>
    <link rel="icon" href="data:," />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="row container mx-auto mt-5">
      <div class="card col-4 offset-2 pt-3">
        <!-- form start -->
        <div class="input-group">
          <span class="input-group-text" id="basic-addon1">@</span>
          <input
            type="text"
            class="form-control"
            placeholder="Username"
            aria-label="Username"
            aria-describedby="basic-addon1"
            id="input__form"
          />
          <button id="get_info">get information</button>
        </div>
        <!-- form end -->
        <img src="" id="avatar-img" class="card-img-top" alt="Avatar" />
        <div class="card-body">
          <div class="row">
            <p class="col-6">user name:</p>
            <p class="card-title col-6" id="user">Card title</p>
            <p class="col-6">Region</p>
            <p class="card-text col-6" id="region"></p>
          </div>
        </div>
        <div class="card-footer">
          <small class="text-body-secondary">There can be your ads</small>
        </div>
      </div>
      <!-- next item -->

      <div class="card col-4 pt-3">
        <div class="row">
          <p class="col-6">Folowers</p>
          <p id="followers" class="col-6"></p>
          <p class="col-6">Following</p>
          <p class="col-6" id="following"></p>
        </div>
      </div>
    </div>
    <script src="./main.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
  </body>
</html>
