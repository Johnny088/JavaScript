<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array</title>
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>array</h1>
      <h2>Завдання 1:</h2>
      <p>
        Створити масив із 20-ти елементів та заповнити його випадковими числами
        від 1 до 100.
      </p>
      <div class="btn_wrap">
        <button class="btn_run" onclick="run_task1()">run task</button>
      </div>
      <!--  -->
      <h2>Завдання 2:</h2>
      <p>
        Відобразити кожний елемент масива у вигляді: [1] – 5 [2] – 78 ... і тд.
      </p>
      <div class="btn_wrap">
        <button class="btn_run" onclick="run_task2()">run task</button>
      </div>
      <!--  -->
      <h2>Завдання 3:</h2>
      <p>Перевірити чи є в масиві число яке кратне 7-ми.</p>
      <div class="btn_wrap">
        <button class="btn_run" onclick="run_task3()">run task</button>
      </div>
      <!--  -->
      <h2>Завдання 4:</h2>
      <p>Відсортувати масив по спаданню.</p>
      <div class="btn_wrap">
        <button class="btn_run" onclick="run_task4()">run task</button>
      </div>
    </div>
    <script src="./js/array.js"></script>
  </body>
</html>
